[Core]
#Enable SLAM & Mapping mode:
Mem/IncrementalMemory = true
Mem/InitWMWithAllNodes = false

#Memory Managemenet
Rtabmap/TimeThr = 0                # Max time (ms) allowed per update (at 1 Hz, 700ms is safe; 0 = unlimited)
Rtabmap/MemoryThr = 0                # Max nodes in Working Memory (0 = disabled; or set to e.g. 400 to hard-cap node count)
Db/Sqlite3InMemory = true           #HEAVY RAM USAGE ~500MB to ~1.2GB
Reg/Force3DoF = true

# Motion & Registration
Reg/Force3DoF = true
Vis/MinInliers = 15

# Occupancy Grid / Costmap Generation
Grid/FromDepth = true
Grid/3D = true
Grid/RayTracing = true
Grid/CellSize = 0.05
Grid/RangeMax = 3.5 
Grid/MaxObstacleHeight = 2.0
Grid/MinObstacleHeight = 0.30

#Visual Params
Marker/Dictionary = 7 #ARUCO 5x5 1000
Marker/Length = 0 #Value <=0 means automatic marker length estimation using the depth image real is 0.12 
RGBD/MarkerDetection = "true"
Rtab/LoopThr = 0.11 # default value 0.11 (A higher value makes the loop closure detector stricter) - determines the loop closure hypothesis threshold
Kp/MaxFeatures = 500                 # Extract up to 500 keypoints per frame (0 disables loop closure!)
Kp/DetectorStrategy = 6              # 6 = GFTT/BRIEF, 8 = ORB (fast and reliable for indoor/sim)
Vis/FeatureType = 6                  # Must match Kp/DetectorStrategy
Vis/MaxFeatures = 500                # Max features used for visual registration
Vis/MinInliers = 20                  # Minimum 3D feature matches required to accept a loop closure
Vis/InlierDistance = 0.1             # Max distance (m) for RANSAC inliers

#Local / Spatial Proximity Loop Closure
RGBD/ProximityBySpace = true         # Detects loop closures when robot returns near past poses in odometry
RGBD/ProximityMaxGraphDepth = 50     # How many nodes back in the graph to check
RGBD/ProximityPathMaxNeighbors = 10  # Max neighbor nodes to compare against
RGBD/NeighborLinkRefining = true     # Refines odometry links using visual/ICP registration
RGBD/OptimizeFromGraphEnd = false

#Graph Optimization & Rejecting Bad Loop Closures
RGBD/OptimizeFromGraphEnd = false    # false = anchors map to initial origin (keeps /map frame stable for Nav2)
RGBD/OptimizeMaxError = 3.0          # Rejects loop closures that would warp the graph by >3x standard error
Optimizer/Strategy = 1               # 1 = g2o, 2 = GTSAM (robust graph optimizers)
Reg/Force3DoF = true                 # Constrains loop closure transforms to 2D (x, y, yaw) so the map doesn't tilt

#Update Triggers (Prevents spamming identical nodes while stationary)
RGBD/AngularUpdate = 0.05            # Only add a graph node after rotating ~3 degrees (rad)
RGBD/LinearUpdate = 0.10             # Only add a graph node after moving 10 cm (m)
Rtabmap/DetectionRate = 1.0          # Run loop closure detection at 1 Hz