ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true          # Set false later if climbing 3D berms/craters matters
    publish_tf: true
    publish_acceleration: false
    use_sim_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry: fuse linear forward velocity (vx) ONLY.
    # Leave x, y, yaw, and vyaw false so skid-steer tire scrub doesn't corrupt heading.
    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_nodelay: true

    # IMU: fuse yaw orientation and yaw angular velocity (vyaw).
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_nodelay: true
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true